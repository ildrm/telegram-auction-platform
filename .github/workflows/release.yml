name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, gd, mbstring, pdo, zip
          coverage: none

      - name: Validate release tag
        run: |
          test "v$(php -r "echo trim(file_get_contents('VERSION'));")" = "${GITHUB_REF_NAME}"

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build release archive
        run: |
          tar --exclude=.git --exclude=.env --exclude=database/database.sqlite \
            --exclude=storage/logs --exclude=storage/app/private \
            -czf "telegram-auction-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum "telegram-auction-${GITHUB_REF_NAME}.tar.gz" > "telegram-auction-${GITHUB_REF_NAME}.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            telegram-auction-${{ github.ref_name }}.tar.gz
            telegram-auction-${{ github.ref_name }}.sha256

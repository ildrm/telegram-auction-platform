version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily
      time: "03:00"
      timezone: Asia/Tehran
    allow:
      - dependency-type: all
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - php

